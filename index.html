<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps CI/CD Lab</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }

        /* Header Styling */
        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px 0;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        header h2 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        /* Content Container Styling */
        .content {
            margin-top: 40px;
            padding: 0 20px;
        }

        h1 {
            color: #2c3e50;
        }

        .status {
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .feature-card {
            background-color: white;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
    </style>
</head>

<body>

    <!-- Header Section -->
    <header>
        <h2>DevOps CI/CD Lab Dashboard</h2>
    </header>

    <!-- Main Content -->
    <div class="content">
        <h1>Example Project for DevOps CI/CD Pipeline</h1>
        <p class="status">Version 2.0: Automated Testing & Deployment Active!</p>

        <div class="feature-card">
            <h3>New Feature Added</h3>
            <p>
                Pushed from local environment, verified by automated tests, and deployed
                live!
            </p>
        </div>
    </div>

</body>

</html>
